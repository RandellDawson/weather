<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Weather</title><script>
/* Apply the last known theme before the stylesheet paints. */
try {
  const saved=JSON.parse(localStorage.getItem('weather-theme')||'null');
  if(saved && (saved.theme==='day'||saved.theme==='night') && Date.now()-saved.savedAt<86400000) {
    document.documentElement.dataset.theme=saved.theme;
    document.documentElement.style.colorScheme=saved.theme==='day'?'light':'dark';
  } else {
    document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'day':'night';
  }
} catch {
  document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'day':'night';
}
</script><link rel="stylesheet" href="/style.css"><script src="/index.js" defer></script></head>
<body><main class="shell">
<section class="hero" aria-label="Current weather"><div><div class="current-toolbar"><p class="eyebrow">CURRENT CONDITIONS</p><button id="locate" type="button" aria-label="Refresh weather using my current device location" title="Refresh weather and device location">↻ Refresh</button></div><p id="status" role="status" aria-live="polite"></p><div class="current-reading"><span id="current-icon" aria-hidden="false"></span><h2 id="temperature">—</h2></div><p id="conditions">Waiting for location</p><p id="source"></p></div><div class="metrics" id="metrics"></div></section>
<section class="panel"><h2>Next 24 Hours</h2><div class="hourly" id="hourly"></div></section>
<section class="panel"><h2>Daily Forecast</h2><div class="days" id="daily"></div></section>
</main></body></html>
