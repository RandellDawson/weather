<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Weather</title><script>
/* Apply the last known theme before the stylesheet paints. */
try {
  const saved=JSON.parse(localStorage.getItem('weather-theme')||'null');
  if(saved && (saved.theme==='day'||saved.theme==='night') && Date.now()-saved.savedAt<86400000) {
    document.documentElement.dataset.theme=saved.theme;
    document.documentElement.style.colorScheme=saved.theme==='day'?'light':'dark';
  } else {
    document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'day':'night';
  }
} catch {
  document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'day':'night';
}
</script><link rel="stylesheet" href="/style.css"><script src="/index.js" defer></script></head>
<body><main class="shell"><section class="location-search" aria-label="Search weather locations"><form id="location-form" autocomplete="off"><div class="location-input-wrap"><label for="location-query">Search by U.S. city or ZIP code</label><input id="location-query" type="text" placeholder="City or ZIP code" maxlength="80" aria-autocomplete="list" aria-controls="location-suggestions" aria-expanded="false" role="combobox"><div id="location-suggestions" class="location-suggestions" role="listbox" hidden></div></div><button type="submit">Search</button></form><p id="location-message" role="status" aria-live="polite"></p><div id="recent-locations" class="recent-locations" aria-label="Recent locations"></div></section>
<section class="hero" aria-label="Current weather"><div><div class="current-toolbar"><p class="eyebrow">CURRENT CONDITIONS</p><button id="locate" type="button" aria-label="Refresh weather using my current device location" title="Refresh weather and device location">↻ Refresh</button></div><p id="current-city" class="current-city" aria-live="polite"></p><p id="status" role="status" aria-live="polite"></p><div class="current-reading"><span id="current-icon" aria-hidden="false"></span><h2 id="temperature">—</h2></div><p id="conditions">Waiting for location</p><p id="feels-like" class="feels-like"></p></div><div class="metrics" id="metrics"></div></section>
<section class="panel"><h2>Next 24 Hours</h2><div class="hourly" id="hourly"></div></section>
<section class="panel"><h2>Daily Forecast</h2><div class="days" id="daily"></div></section>
<footer id="source" aria-label="Weather data sources"></footer>
</main></body></html>
